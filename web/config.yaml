rom: ./roms/super-mario-land.gb
server:
  host: 0.0.0.0
  port: 8080
emulator:
  fps: 60
  frame_skip: 4          # N 帧推送一次画面到前端（60/4 = 15fps）
  save_path: ./saves/
  cgb: false
  palette: greyscale     # greyscale | original | bgb（绿色调）
agent:
  mode: hybrid              # rules | llm | hybrid | manual
  llm_interval_ms: 500
  safety_net_frames: 120    # 停止前进 N 帧后强制救援（0=默认120）
  model: gpt-4o-mini        # 预留：P3 接真实 LLM 时使用
  api_key_env: OPENAI_API_KEY # 预留：真实 LLM 的 API 密钥环境变量名
  rules_first: true
game: sml                # 游戏插件 id（P2 起生效）
webui: ./web/webui